<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Acta de Retiro/Entrega</title>
    <link rel="stylesheet" href="/CSS/Estilo.css">
</head>

<body>
    <header>
        <nav>
            <a href="../HOLDINGCARS-FRONTEND/Inicio.html">Inicio</a>
            <a href="../HOLDINGCARS-FRONTEND/Producto.html">Vehiculos</a>
            <a href="..//HOLDINGCARS-FRONTEND/Login.html">Salir</a>
        </nav>
    </header>

    <div class="container" id="formulario-acta">
        <!-- se llena segun el auto -->
        <h1 id="titulo-acta">Acta de Vehiculo</h1>

        <!-- Mostramos los datos del auto seleccionado -->
        <div id="datos-auto" style="background: #f9f9f9; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
            <!-- JS llena esto -->
        </div>

        <form id="actaForm">
            <div class="form-group">
                <label>Kilometraje Actual (km)</label>
                <input type="number" id="km" required>
            </div>

            <div class="form-group">
                <label>Nivel de Combustible</label>
                <select id="combustible" required>
                    <option value="">-- Seleccione --</option>
                    <option value="1/4">1/4</option>
                    <option value="1/2">1/2</option>
                    <option value="3/4">3/4</option>
                    <option value="Lleno">Lleno</option>
                </select>
            </div>

            <div class="form-group">
                <label>Estado de Neumáticos</label>
                <select id="neumaticos">
                    <option value="Bueno">Bueno</option>
                    <option value="Regular">Regular</option>
                    <option value="Malo">Malo</option>
                </select>
            </div>

            <div class="form-group">
                <label>Daños en Carrocería (Según acta)</label>
                <div>
                    <input type="checkbox" id="rayas"> Rayas
                    <input type="checkbox" id="abolladuras"> Abolladuras
                    <input type="checkbox" id="rotura"> Rotura de vidrios
                </div>
            </div>

            <button type="button" onclick="generarActa()">Guardar Acta</button>
        </form>
    </div>

    <script src="../JS/Validaciones.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Obtenemos el ID desde la URL
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            // Usamos la función global del Validaciones.js
            const vehiculo = obtenerVehiculoPorId(id);

            if (vehiculo) {
                // Título del acta
                document.getElementById('titulo-acta').innerText = `Acta para ${vehiculo.nombre}`;

                // Datos del auto precargados (Patente y KM)
                document.getElementById('datos-auto').innerHTML = `
                    <p><strong>Patente:</strong> ${vehiculo.patente}</p>
                    <p><strong>Kilometraje Inicial:</strong> ${vehiculo.kilometraje.toLocaleString('es-CL')} km</p>
                `;
            } else {
                document.getElementById('formulario-acta').innerHTML = "<h2>Vehículo no encontrado</h2>";
            }
        });

        function generarActa() {
            const km = document.getElementById('km').value;
            const combustible = document.getElementById('combustible').value;

            if (!km || !combustible) {
                alert("Debe completar el kilometraje y el combustible.");
                return;
            }

            // Guardamos en LocalStorage
            const acta = {
                vehiculoId: new URLSearchParams(window.location.search).get('id'),
                km: km,
                combustible: combustible,
                fecha: new Date().toISOString()
            };
            guardarActaLocalStorage(acta);

            alert("Acta generada exitosamente.");
            window.location.href = "../USUARIOS/Admin.html";
        }
    </script>
</body>

</html>
