<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="../CSS/Estilo.css">
</head>

<body>
  <header>
    <img src="../IMG/holding_cars_logo.jpg" alt="Logo HoldingCars">
    <div class="logo">
      <h1>HoldingCars</h1>
    </div>
    <nav>
      <li><a href="Inicio.html">Inicio</a></li>
      <li><a href="Producto.html">Flota</a></li>
    </nav>
  </header>

  <div class="container" style="max-width: 400px; margin-top: 50px;">
    <h2 style="text-align: center;">Acceso Administrador</h2>
  </div>
  <div class="form-group">
    <label>Contraseña</label>
    <input type="password" id="loginPass" required>
  </div>
  <button type="button" onclick="iniciarSesion()">Ingresar</button>
  </form>
  </div>

  <div class="form-group">
    <label for="loginPass">Contraseña</label>
    <input type="password" id="loginPass" placeholder="••••••••" required>
  </div>

  <button type="button" onclick="iniciarSesion()">Ingresar</button>
  </form>
  </div>

  <script src="JS/Validaciones.js"></script>
  <script>
    function iniciarSesion() {
      const correo = document.getElementById('loginCorreo').value;
      const pass = document.getElementById('loginPass').value;

      // Validar formato de correo
      const regexCorreo = /^[^\s@]+@(duoc\.cl|profesor\.duoc\.cl|gmail\.com)$/;
      if (!regexCorreo.test(correo)) {
        alert("Correo no válido. Solo @duoc.cl, @profesor.duoc.cl o @gmail.com");
        return;
      }

      // Validar contraseña
      if (pass.length < 4 || pass.length > 10) {
        alert("La contraseña debe tener entre 4 y 10 caracteres.");
        return;
      }

      // Simulación de login exitoso
      alert("Bienvenido/a al sistema de actas");
      window.location.href = "USUARIOS/Admin.html";
    }
  </script>
</body>

</html>
