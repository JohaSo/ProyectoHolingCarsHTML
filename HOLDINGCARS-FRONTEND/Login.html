<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="../CSS/Estilo.css">
</head>

<body>
  <header>
    <nav>
      <li><a href="../HOLDINGCARS-FRONTEND/Inicio.html">Inicio</a></li>
    </nav>
  </header>

  <div class="container" style="max-width: 400px;">
    <!-- Logo de la empresa -->
    <div style="text-align: center; margin-bottom: 20px;">
      <img src="../IMG/holding_cars_logo.jpg" alt="Logo HoldingCars" style="width: 100px;">
      <h2>HoldingCars</h2>
    </div>
  </div>

  <form id="formLogin">
    <div class="form-group">
      <label>Correo</label>
      <input type="email" id="loginCorreo" required>
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="loginPass" required>
    </div>
    <button type="button" onclick="iniciarSesion()">Ingresar</button>
  </form>
  </div>

  <script src="../JS/Validaciones.js"></script>
  <script>
    function iniciarSesion() {
      const correo = document.getElementById('loginCorreo').value;
      const pass = document.getElementById('loginPass').value;

      // Validación de correo
      const regexCorreo = /^[^\s@]+@(duoc\.cl|profesor\.duoc\.cl|gmail\.com)$/;
      if (!regexCorreo.test(correo)) {
        alert("Correo no válido. Solo @duoc.cl, @profesor.duoc.cl o @gmail.com");
        return;
      }

      // Validación de contraseña
      if (pass.length < 4 || pass.length > 10) {
        alert("La contraseña debe tener entre 4 y 10 caracteres.");
        return;
      }

      alert("Bienvenido/a al sistema.");
      // Redirigir al panel de administración
      window.location.href = "USUARIOS/Admin.html";
    }
  </script>
</body>

</html>
