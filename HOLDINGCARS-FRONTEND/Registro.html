<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Registro Usuario</title>
  <link rel="stylesheet" href="../CSS/Estilo.css">
</head>

<body>
  <header>
    <nav>
      <a href="../HOLDINGCARS-FRONTEND/Inicio.html">Inicio</a>
    </nav>
  </header>


  <div class="container" style="max-width: 600px;">
    <h2>Registro de Chofer o Adiministrador</h2>
    <form id="formRegistro" onsubmit="return false;">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" maxlength="100" placeholder="Ej: Juan Pérez" required>
      </div>

      <div class="form-group">
        <label for="correo">Correo (Debe ser @duoc.cl, @profesor.duoc.cl o @gmail.com)</label>
        <input type="email" id="correo" maxlength="100" placeholder="ejemplo@duoc.cl" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña (4 a 10 caracteres)</label>
        <input type="password" id="password" required>
      </div>

      <div class="form-group">
        <label for="rut">RUT (Ej: 19011022K)</label>
        <input type="text" id="rut" maxlength="9" placeholder="12345678K" required>
      </div>

      <div class="form-group">
        <label for="region">Región</label>
        <select id="region" onchange="cargarComunas('region', 'comuna')" required>
          <option value="">-- Seleccione --</option>
          <!-- JS llena las regiones dinamicamente -->
        </select>
      </div>

      <div class="form-group">
        <label for="comuna">Comuna</label>
        <select id="comuna" required>
          <option value="">-- Seleccione --</option>
        </select>
      </div>

      <button type="button" onclick="validarRegistro()">Registrar</button>
    </form>
  </div>

  <!-- Carga del JS principal -->
  <script src="../JS/Validaciones.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const selectRegion = document.getElementById('region');
      regiones.forEach(reg => {
        const option = document.createElement('option');
        option.value = reg.nombre;
        option.textContent = reg.nombre;
        selectRegion.appendChild(option);
      });
    });

    function validarRegistro() {
      const correo = document.getElementById('correo').value;
      const pass = document.getElementById('password').value;
      const rut = document.getElementById('rut').value;

      const regexCorreo = /^[^\s@]+@(duoc\.cl|profesor\.duoc\.cl|gmail\.com)$/;
      if (!regexCorreo.test(correo)) {
        alert("Correo no válido. Solo @duoc.cl, @profesor.duoc.cl o @gmail.com");
        return;
      }

      if (pass.length < 4 || pass.length > 10) {
        alert("Contraseña inválida (4 a 10 caracteres).");
        return;
      }

      if (!validarRut(rut)) {
        alert("El RUT ingresado no es válido.");
        return;
      }

      alert("Registro exitoso.");
    }
  </script>
</body>

</html>
